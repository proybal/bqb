name: Deploy BQB

on:
  push:
    branches:
      - main

concurrency:
  group: bqb-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Bluehost VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            cd /home/burquebr/public_html/bqb

            echo "Fetching latest BQB code..."
            git fetch origin
            git reset --hard origin/main

            echo "Installing dependencies..."
            .venv/bin/python -m pip install \
              -r requirements.txt

            echo "Checking Django..."
            .venv/bin/python manage.py check

            echo "Applying migrations..."
            .venv/bin/python manage.py migrate --noinput

            echo "Collecting static files..."
            .venv/bin/python manage.py collectstatic --noinput

            echo "Restarting Gunicorn..."
            sudo /bin/systemctl restart burquebro
            sudo /bin/systemctl is-active --quiet burquebro

            echo "Testing local application..."
            curl --fail --silent --show-error \
              -H "Host: burquebro.com" \
              http://127.0.0.1:8001/ \
              >/dev/null

            echo "BQB deployment complete."
